[project]
name = "agentos-compute"
version = "0.0.0"
description = "AgentOS stateless compute package skeleton"
requires-python = ">=3.13,<3.14"
dependencies = [
    "grpcio==1.84.0",
    "protobuf==7.36.2",
    "pypdf==6.21.1",
    "python-docx==1.2.0",
]

[project.scripts]
agentos-compute = "agentos_compute.__main__:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff==0.17.1",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "grpcio-tools==1.84.0",
    "grpc-stubs==1.53.0.6",
    "types-protobuf>=7.35.1.20260906",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["src/agentos_compute/generated/compute_pb2.py", "src/agentos_compute/generated/compute_pb2.pyi", "src/agentos_compute/generated/compute_pb2_grpc.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src"]
exclude = ["src/agentos_compute/generated/compute_pb2.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
required-version = "==0.11.8"
