[project]
name = "agentos-compute"
version = "0.0.0"
description = "AgentOS stateless compute package skeleton"
requires-python = ">=3.13,<3.14"
dependencies = []

[project.scripts]
agentos-compute = "agentos_compute.__main__:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ruff==0.17.1", "mypy==2.4.0", "pytest==9.1.1"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
required-version = "==0.11.8"
